<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxec Dashboard - Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        h1 { font-size: 2rem; margin-bottom: 8px; }
        .subtitle { color: #8892b0; font-size: 0.95rem; }
        .date { color: #64ffda; margin-top: 8px; font-size: 0.85rem; }
        
        /* View Toggle */
        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .view-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #8892b0;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .view-btn.active {
            background: #64ffda;
            color: #1a1a2e;
            border-color: #64ffda;
        }
        .view-btn:hover:not(.active) {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        
        /* Stats Row */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-number { font-size: 2.2rem; font-weight: bold; }
        .stat-label { color: #8892b0; font-size: 0.8rem; margin-top: 5px; }
        .pending .stat-number { color: #ffd93d; }
        .progress .stat-number { color: #6bcb77; }
        .review .stat-number { color: #4d96ff; }
        .completed .stat-number { color: #ff6b6b; }
        
        /* Kanban View */
        .kanban-view { display: none; }
        .kanban-view.active { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        
        .kanban-column {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 15px;
            min-height: 400px;
        }
        .kanban-column h3 {
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .kanban-column h3 .count {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
        }
        
        .kanban-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border-left: 4px solid;
            transition: all 0.3s;
        }
        .kanban-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .kanban-card.pending { border-color: #ffd93d; }
        .kanban-card.progress { border-color: #6bcb77; }
        .kanban-card.review { border-color: #4d96ff; }
        .kanban-card.completed { border-color: #ff6b6b; opacity: 0.7; }
        
        .kanban-card h4 { font-size: 0.95rem; margin-bottom: 6px; }
        .kanban-card p { color: #8892b0; font-size: 0.8rem; }
        .kanban-card .card-date { color: #64ffda; font-size: 0.7rem; margin-top: 8px; }
        
        /* List View */
        .list-view { display: none; }
        .list-view.active { display: block; }
        
        .task-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border-left: 4px solid;
            transition: all 0.3s;
        }
        .task-item:hover { background: rgba(255,255,255,0.08); }
        .task-item.pending { border-color: #ffd93d; }
        .task-item.progress { border-color: #6bcb77; }
        .task-item.review { border-color: #4d96ff; }
        .task-item.completed { border-color: #ff6b6b; opacity: 0.7; }
        
        /* Modal for Task Details */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; justify-content: center; align-items: flex-start; }
        
        .modal {
            background: #1a1a2e;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            margin-top: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-size: 1.2rem; }
        .modal-close {
            background: none;
            border: none;
            color: #8892b0;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-body { padding: 20px; }
        
        .instruction-section {
            background: rgba(100, 255, 218, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .instruction-section h4 {
            color: #64ffda;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .instruction-step {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .step-num {
            background: #64ffda;
            color: #1a1a2e;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .code-block {
            background: #0d1117;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.8rem;
            color: #c9d1d9;
            white-space: pre;
        }
        
        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #238636;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            margin: 5px;
            transition: all 0.3s;
        }
        .action-link:hover { background: #2ea043; transform: translateY(-2px); }
        .action-link.secondary { background: #1f6feb; }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: #8892b0;
            font-size: 0.8rem;
        }
        .footer a { color: #64ffda; text-decoration: none; }
        
        @media (max-width: 900px) {
            .kanban-view.active, .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Nuxec Dashboard</h1>
            <p class="subtitle">Task Manager • Built by Orland</p>
            <p class="date" id="currentDate"></p>
        </header>
        
        <div class="view-toggle">
            <button class="view-btn active" onclick="switchView('kanban')">📊 Kanban</button>
            <button class="view-btn" onclick="switchView('list')">📋 List</button>
        </div>
        
        <div class="stats">
            <div class="stat-card pending">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card progress">
                <div class="stat-number" id="progressCount">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-card review">
                <div class="stat-number" id="reviewCount">0</div>
                <div class="stat-label">Review</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>
        
        <!-- Kanban View -->
        <div class="kanban-view active" id="kanbanView">
            <div class="kanban-column">
                <h3 style="color: #ffd93d;">⏳ Pending <span class="count" id="kanbanPending">0</span></h3>
                <div id="kanbanPendingList"></div>
            </div>
            <div class="kanban-column">
                <h3 style="color: #6bcb77;">🔄 In Progress <span class="count" id="kanbanProgress">0</span></h3>
                <div id="kanbanProgressList"></div>
            </div>
            <div class="kanban-column">
                <h3 style="color: #4d96ff;">👀 Review <span class="count" id="kanbanReview">0</span></h3>
                <div id="kanbanReviewList"></div>
            </div>
            <div class="kanban-column">
                <h3 style="color: #ff6b6b;">✅ Completed <span class="count" id="kanbanCompleted">0</span></h3>
                <div id="kanbanCompletedList"></div>
            </div>
        </div>
        
        <!-- List View -->
        <div class="list-view" id="listView">
            <ul class="task-list" id="taskList"></ul>
        </div>
        
        <div class="footer">
            <p>Last updated by Orland • <span id="lastUpdated"></span></p>
        </div>
    </div>
    
    <!-- Task Detail Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalTitle">Task Details</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

        function switchView(view) {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.view-btn[onclick="switchView('${view}')"]`).classList.add('active');
            document.getElementById('kanbanView').classList.toggle('active', view === 'kanban');
            document.getElementById('listView').classList.toggle('active', view === 'list');
        }
        
        function renderKanban() {
            const columns = { pending: [], progress: [], review: [], completed: [] };
            tasks.forEach(task => {
                const status = task.status === 'in-progress' ? 'progress' : task.status;
                columns[status].push(task);
            });
            
            Object.keys(columns).forEach(status => {
                const list = document.getElementById(`kanban${status.charAt(0).toUpperCase() + status.slice(1)}List`);
                const count = document.getElementById(`kanban${status.charAt(0).toUpperCase() + status.slice(1)}`);
                list.innerHTML = '';
                columns[status].forEach(task => {
                    const card = document.createElement('div');
                    card.className = `kanban-card ${status}`;
                    card.onclick = () => showModal(task);
                    card.innerHTML = `
                        <h4>${task.title}</h4>
                        <p>${task.desc}</p>
                        <div class="card-date">📅 ${task.date}</div>
                    `;
                    list.appendChild(card);
                });
                count.textContent = columns[status].length;
            });
        }
        
        function renderList() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.sort((a,b) => new Date(b.date) - new Date(a.date));
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.status === 'in-progress' ? 'progress' : task.status}`;
                li.onclick = () => showModal(task);
                li.innerHTML = `
                    <span class="status-badge ${task.status === 'in-progress' ? 'progress' : task.status}">${formatStatus(task.status)}</span>
                    <div class="task-content">
                        <div class="task-title">${task.title}</div>
                        <div class="task-desc">${task.desc}</div>
                        <div class="task-date">📅 ${task.date}</div>
                    </div>
                `;
                list.appendChild(li);
            });
        }
        
        function showModal(task) {
            const modal = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').textContent = task.title;
            
            let linksHtml = task.links.map(l => 
                `<a href="${l.url}" target="_blank" class="action-link ${l.secondary ? 'secondary' : ''}">${l.text}</a>`
            ).join('');
            
            let instructionsHtml = task.instructions.map(i => `
                <div class="instruction-step">
                    <span class="step-num">${i.step}</span>
                    <span>${i.text}</span>
                </div>
            `).join('');
            
            let codeHtml = task.code ? `
                <div class="instruction-section">
                    <h4>📝 Code</h4>
                    <div class="code-block">${escapeHtml(task.code)}</div>
                </div>
            ` : '';
            
            document.getElementById('modalBody').innerHTML = `
                <p style="color: #8892b0; margin-bottom: 20px;">${task.desc}</p>
                
                ${linksHtml ? `<div style="margin-bottom: 20px;">${linksHtml}</div>` : ''}
                
                <div class="instruction-section">
                    <h4>📋 Instructions</h4>
                    ${instructionsHtml}
                </div>
                
                ${codeHtml}
                
                <div style="color: #64ffda; font-size: 0.8rem; margin-top: 15px;">
                    📅 Created: ${task.date}
                </div>
            `;
            
            modal.classList.add('active');
        }
        
        function closeModal(e) {
            if (!e || e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        }
        
        function escapeHtml(text) {
            return text.replace(/</g, '<').replace(/>/g, '>');
        }
        
        function formatStatus(status) {
            const map = { pending: 'Pending', progress: 'In Progress', review: 'Review', completed: 'Completed' };
            return map[status] || status;
        }
        
        function updateStats() {
            const counts = { pending: 0, progress: 0, review: 0, completed: 0 };
            tasks.forEach(task => {
                const status = task.status === 'in-progress' ? 'progress' : task.status;
                counts[status]++;
            });
            document.getElementById('pendingCount').textContent = counts.pending;
            document.getElementById('progressCount').textContent = counts.progress;
            document.getElementById('reviewCount').textContent = counts.review;
            document.getElementById('completedCount').textContent = counts.completed;
        }
        
        // Initialize
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });
        document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
        
        renderKanban();
        renderList();
        updateStats();
    </script>
</body>
</html>
