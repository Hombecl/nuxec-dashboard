<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuxec Dashboard - Daily Tasks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            text-align: center;
            padding: 40px 0;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { color: #8892b0; font-size: 1.1rem; }
        .date { color: #64ffda; margin-top: 10px; font-size: 0.9rem; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 3rem; font-weight: bold; }
        .stat-label { color: #8892b0; margin-top: 5px; }
        
        .pending .stat-number { color: #ffd93d; }
        .progress .stat-number { color: #6bcb77; }
        .review .stat-number { color: #4d96ff; }
        .completed .stat-number { color: #ff6b6b; }
        
        .section { margin-bottom: 40px; }
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .task-list { list-style: none; }
        .task-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 4px solid;
            transition: all 0.3s;
        }
        .task-item:hover { background: rgba(255,255,255,0.08); }
        .task-item.pending { border-color: #ffd93d; }
        .task-item.progress { border-color: #6bcb77; }
        .task-item.review { border-color: #4d96ff; }
        .task-item.completed { border-color: #ff6b6b; opacity: 0.7; }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-badge.pending { background: #ffd93d; color: #1a1a2e; }
        .status-badge.progress { background: #6bcb77; color: #1a1a2e; }
        .status-badge.review { background: #4d96ff; color: #fff; }
        .status-badge.completed { background: #ff6b6b; color: #fff; }
        
        .task-content { flex: 1; }
        .task-title { font-size: 1.1rem; margin-bottom: 5px; }
        .task-desc { color: #8892b0; font-size: 0.9rem; }
        .task-date { color: #64ffda; font-size: 0.8rem; }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: #8892b0;
            font-size: 0.85rem;
        }
        .footer a { color: #64ffda; text-decoration: none; }
        
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Nuxec Dashboard</h1>
            <p class="subtitle">Daily Task Tracker • Built by Orland</p>
            <p class="date" id="currentDate"></p>
        </header>
        
        <div class="stats">
            <div class="stat-card pending">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card progress">
                <div class="stat-number" id="progressCount">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-card review">
                <div class="stat-number" id="reviewCount">0</div>
                <div class="stat-label">Review</div>
            </div>
            <div class="stat-card completed">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>
        
        <div class="section">
            <h2 class="section-title">📋 All Tasks</h2>
            <ul class="task-list" id="taskList">
                <!-- Tasks will be loaded here -->
            </ul>
        </div>
        
        <div class="footer">
            <p>Last updated by Orland • <span id="lastUpdated"></span></p>
        </div>
    </div>
    
    <script>
        // Task Data - 呢度係我哋啲task
        const tasks = [
            {
                id: 1,
                title: "Setup nuxec-dashboard",
                desc: "Create GitHub repo and Vercel project for Orland to auto-deploy",
                status: "completed",
                date: "2026-01-30"
            },
            {
                id: 2,
                title: "Build Dashboard UI",
                desc: "HTML dashboard with task tracking functionality",
                status: "completed",
                date: "2026-01-30"
            },
            {
                id: 3,
                title: "Walmart Scraper Development",
                desc: "Create Puppeteer script for scraping product data + seller info",
                status: "in-progress",
                date: "2026-01-31"
            },
            {
                id: 4,
                title: "Communication System Setup",
                desc: "Define task submission format + daily summary workflow",
                status: "in-progress",
                date: "2026-01-31"
            },
            {
                id: 5,
                title: "Daily Summary Automation",
                desc: "Morning summary of what Orland worked on + today's plan",
                status: "pending",
                date: "2026-02-01"
            },
            {
                id: 6,
                title: "n8n Integration",
                desc: "Create n8n workflow for task notifications",
                status: "pending",
                date: "2026-02-01"
            }
        ];
        
        // Render functions
        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.status}`;
                li.innerHTML = `
                    <span class="status-badge ${task.status}">${formatStatus(task.status)}</span>
                    <div class="task-content">
                        <div class="task-title">${task.title}</div>
                        <div class="task-desc">${task.desc}</div>
                        <div class="task-date">${task.date}</div>
                    </div>
                `;
                list.appendChild(li);
            });
        }
        
        function updateStats() {
            const counts = { pending: 0, progress: 0, review: 0, completed: 0 };
            tasks.forEach(task => {
                const status = task.status === 'in-progress' ? 'progress' : task.status;
                counts[status]++;
            });
            
            document.getElementById('pendingCount').textContent = counts.pending;
            document.getElementById('progressCount').textContent = counts.progress;
            document.getElementById('reviewCount').textContent = counts.review;
            document.getElementById('completedCount').textContent = counts.completed;
        }
        
        function formatStatus(status) {
            const map = { pending: 'Pending', progress: 'In Progress', review: 'Review', completed: 'Completed' };
            return map[status] || status;
        }
        
        // Initialize
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });
        document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
        
        renderTasks();
        updateStats();
    </script>
</body>
</html>
